<!DOCTYPE html>
<html lang="id">
<head>
  <!-- META ANTI-CACHE: Memaksa browser HP selalu memuat pesan terbaru -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Chat App</title>
  <!-- Menghubungkan ke file CSS eksternal -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-box">
    <div class="header">
      💬 Chat App
      <!-- Tempat teks indikator mengetik muncul -->
      <div id="typing-status"></div>
    </div>

    <!-- Kolom input nama pengguna -->
    <input id="username" placeholder="Username" oninput="renderDeleteButtons()">

    <!-- Wadah pesan chat -->
    <div id="messages"></div>

    <!-- Area input pesan dan file -->
    <div class="input-area">
      <input type="file" id="file-input" accept="image/*,video/*" style="display: none;" onchange="handleFileSelect()">
      <button class="btn-attach" onclick="document.getElementById('file-input').click()">📎</button>
      <input id="msg" placeholder="Ketik pesan..." autocomplete="off">
      <button onclick="sendMsg()">➤</button>
    </div>
  </div>

  <!-- Memuat library Socket.io dan file Javascript eksternal -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
