<!DOCTYPE html>
<html lang="id">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Modern Chat App with Themes</title>
  <link rel="stylesheet" href="style.css">
</head>
<!-- Default menggunakan tema cyberpunk -->
<body class="theme-cyberpunk">

  <div class="chat-container">
    <!-- PANEL KIRI: Menu Pengaturan Profil & Tema -->
    <div class="profile-panel">
      <h3>Profil Saya</h3>
      <div class="avatar-selection">
        <img id="current-avatar" src="https://dicebear.com" alt="Avatar">
        <p>Pilih Karakter:</p>
        <div class="avatar-options">
          <img class="avatar-opt active" src="https://dicebear.com" onclick="changeAvatar('User1')">
          <img class="avatar-opt" src="https://dicebear.com" onclick="changeAvatar('Alex')">
          <img class="avatar-opt" src="https://dicebear.com" onclick="changeAvatar('Mia')">
          <img class="avatar-opt" src="https://dicebear.com" onclick="changeAvatar('Leo')">
        </div>
      </div>
      <input id="username" placeholder="Masukkan Username..." oninput="renderDeleteButtons()">

      <!-- TAMBAHAN: Menu Pilihan Tema -->
      <div class="theme-selection">
        <h4>Pilih Tema</h4>
        <div class="theme-buttons">
          <button class="btn-theme active" onclick="setTheme('cyberpunk')">🎨 Cyberpunk</button>
          <button class="btn-theme" onclick="setTheme('midnight')">🌌 Midnight</button>
          <button class="btn-theme" onclick="setTheme('forest')">🌿 Forest Mint</button>
        </div>
      </div>
    </div>

    <!-- PANEL KANAN: Ruang Obrolan Chat -->
    <div class="chat-box">
      <div class="header">
        <div class="header-info">
          <span class="room-title">💬 Ruang Obrolan</span>
          <div id="typing-status"></div>
        </div>
      </div>

      <div id="messages"></div>

      <div class="input-area">
        <input type="file" id="file-input" accept="image/*,video/*" style="display: none;" onchange="handleFileSelect()">
        <button class="btn-attach" onclick="document.getElementById('file-input').click()">📎</button>
        <input id="msg" placeholder="Ketik pesan di sini..." autocomplete="off">
        <button class="btn-send" onclick="sendMsg()">➤</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
